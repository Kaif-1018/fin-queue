[pytest]
testpaths = tests

# `app` is importable when pytest runs from backend/, matching how uvicorn and
# celery import it.
pythonpath = .

# auto: every `async def test_*` is collected without an @pytest.mark.asyncio.
asyncio_mode = auto

# Fixtures must share the test's event loop. An asyncpg connection is bound to
# the loop that opened it, so a session-scoped fixture loop would hand the test
# body a connection from another loop and fail on close with "attached to a
# different loop". Nothing here needs a longer-lived loop: the two session-scoped
# fixtures (database creation, truncation) are both synchronous by design —
# Alembic's env.py calls asyncio.run() itself and cannot be awaited into.
asyncio_default_fixture_loop_scope = function

addopts = -q --strict-markers --tb=short
